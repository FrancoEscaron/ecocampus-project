<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="EcoCampus es una plataforma donde accederás a diversos cursos pudiendo pagar con acciones sustentables.">
    <title>EcoCampus - Ingresar</title>
    <link rel="icon" href="assets/favicons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-icon-180x180.png">
    <link rel="manifest" href="assets/favicons/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header>
        <div class="inner-header">
            <a class="brand" href="/index.html">
                <img class="brand-logo" aria-hidden="true" src="assets/icons/EcoCampus.png" alt="logo de ecocampus">
                <span class="brand-name"><strong>Eco</strong>Campus</span>
            </a>
    </header>
    <main class="login-hero-wrapper">
        <div class="form-container login-form-box">
            <h2 class="contact-title login-title-center">Iniciar Sesión</h2>
            <form id="login-form" class="form login-form-spacing">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <button type="submit" class="submit-btn modal-full-width-btn">Ingresar</button>
                <a href="/register.html" class="register">¿No tienes cuenta?</a>
            </form>
        </div>
    </main>
    <script src="/js/script.js"></script>
</body>

</html>

</html>
